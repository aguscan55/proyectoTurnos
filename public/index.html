<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.20/index.global.min.js'></script>
  <title>Turnos App</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      display: flex;
    }

    .sidebar {
      width: 220px;
      background: #1e1e2f;
      color: white;
      height: 100vh;
      padding: 20px;
    }

    .sidebar button {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      background: #333;
      border: none;
      color: white;
      cursor: pointer;
    }

    .main {
      flex: 1;
      padding: 20px;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
    }

    .day {
      border: 1px solid #ccc;
      min-height: 120px;
      padding: 5px;
    }

    .appointment {
      background: #4caf50;
      color: white;
      margin-top: 5px;
      padding: 4px;
      font-size: 12px;
    }

    input, button {
      padding: 8px;
      margin: 5px 0;
    }
  </style>
</head>

<body x-data="app" x-init="init()">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2>Turnos</h2>
    <button @click="view='calendar'">Calendario</button>
    <button @click="view='create'">Nuevo turno</button>
    <button @click="view='createSlot'">Crear Slot</button>
  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- CALENDAR -->
    <div x-show="view === 'calendar'">
      <h1>Calendario</h1>
      <div id="calendar"></div>    
    </div>
    <!-- La ventanita que aparece al clickear sobre un turno ya existente: -->
    <div x-show="showModal" style="
      position: fixed;
      top:0; left:0;
      width:100%; height:100%;
      background: rgba(0,0,0,0.5);
      display:flex;
      align-items:center;
      justify-content:center;
    ">
      <div style="background:rgb(223, 251, 255); padding:20px; border-radius:10px;">

        <h2>Turno</h2>

        <p><strong>Nombre:</strong> <span x-text="selectedSlot?.firstname + ' ' + selectedSlot?.lastname"></span></p>
        <p><strong>Fecha:</strong> <span x-text="selectedSlot?.date"></span></p>
        <p><strong>Estado:</strong> Ocupado</p>
        <p><strong>Horario:</strong> ...</p>

        <button @click="handleEditAppointment(selectedSlot)">Editar</button>
        <button @click="handleDeleteAppointment(selectedSlot.id)">Eliminar</button>
        <button @click="showModal = false">Cerrar</button>

      </div>
    </div>

    <!-- FORM PARA TOMAR UN TURNO -->
    <div x-show="view === 'create'">
      <h1 x-text="editingId ? 'Editar Turno' : 'Nuevo Turno'"></h1>

      <p><strong>Fecha:</strong> <span x-text="form.date"></span></p>
      <input type="text" placeholder="Nombre" x-model="form.firstname">
      <input type="text" placeholder="Apellido" x-model="form.lastname">
      <input type="text" placeholder="DNI" x-model="form.dni">

      <button @click="handleScheduleAppointment()">Guardar</button>
    </div>

    <!-- FORM PARA CREAR UN TURNO -->
    <div x-show="view === 'createSlot'">
      <h1>Crear Slot</h1>

      <input type="text" placeholder="Médico" x-model="slotForm.doctor">
      <input type="text" placeholder="Especialidad" x-model="slotForm.specialty">
      <input type="datetime-local" x-model="slotForm.date">

      <button @click="handleCreateSlot()">Guardar</button>
    </div>

  </div>

<script type="module">
  import Alpine from 'https://unpkg.com/alpinejs@3.x.x/dist/module.esm.js'
  import { scheduleAppointment, editAppointment, deleteAppointment } from './js/appointments.js'
  import { createAppointmentSlot } from './js/slots.js'

  window.Alpine = Alpine
  Alpine.data('app', () => ({
    view: 'calendar',
    appointments: [],
    editingId: null,

    form: {
      firstname: '',
      lastname: '',
      dni: '',
      date: ''
    },

    slotForm: {
      doctor: '',
      specialty: '',
      date: ''
    },

    days: [],
    selectedSlot: null,
    showModal: false,

    async init() {
      this.generateWeek();
      await this.initCalendar();
      //await this.loadAppointments();
    },

    generateWeek() {
      const today = new Date();
      this.days = [];

      for (let i = 0; i < 7; i++) {
        let d = new Date();
        d.setDate(today.getDate() + i);
        this.days.push(d.toISOString().split('T')[0]);
      }
    },

    formatTime(date) {
      return new Date(date).toLocaleTimeString([], {
        hour: '2-digit',
        minute: '2-digit'
      });
    },

//    async loadAppointments() {
//      const res = await fetch("http://localhost:3000/appointments");
//      this.appointments = await res.json();
//    }, la de abajo seria su reemplazo usando FullCalendar

    async refreshCalendar() {
      const res = await fetch("http://localhost:3000/slots");
      const slots = await res.json();

      this.calendar.removeAllEvents();

      this.calendar.addEventSource(
        slots.map(s => ({
          id: s.id,
          title: s.is_booked ? (s.firstname + ' ' + s.lastname) : "Disponible",
          start: s.date,
          color: s.is_booked ? "red" : "green",
          extendedProps: {
            is_booked: s.is_booked,
            appointment_id: s.appointment_id,
            firstname: s.firstname,
            lastname: s.lastname,
            dni: s.dni
          }
        }))
      );
    },

    async initCalendar() {
      const res = await fetch("http://localhost:3000/slots")
      const slots = await res.json()

      this.calendar = new FullCalendar.Calendar(
        document.getElementById('calendar'),
        {
          initialView: 'dayGridMonth',

          events: slots.map(s => ({
            id: s.id,
            title: s.is_booked ? (s.firstname + ' ' + s.lastname) : "Disponible",
            start: s.date,
            color: s.is_booked ? "red" : "green",
            extendedProps: {
              is_booked: s.is_booked,
              appointment_id: s.appointment_id,
              firstname: s.firstname,
              lastname: s.lastname,
              dni: s.dni
            }
          })),

          //La lógica de clickear en un turno (disponible o agendado)
          eventClick: async (info) => {
            const props = info.event.extendedProps;

            if (!props.is_booked) {  //Te lleva al forms a agendar un turno
              this.form = {
                slot_id: info.event.id,
                firstname: "",
                lastname: "",
                dni: ""
              };
              this.view = 'create';

            } else {  //Te lleva al Modal a editar tu turno
              this.editingId = props.appointment_id;
              //this.view = "edit";
              this.selectedSlot = {
                id: info.event.id,
                appointment_id: props.appointment_id,
                firstname: props.firstname,
                lastname: props.lastname,
                dni: props.dni,
                date: info.event.start.toISOString()
              };
              this.showModal = true
            }
          }
        }
      )

      this.calendar.render()
    },

//////Aca esta el scheduleAppointment//////
    async handleScheduleAppointment() {
      try {
        if (this.editingId) {
          await editAppointment(this.editingId, this.form);
          this.editingId = null;
        } else {
          await scheduleAppointment(this.form);
        }
        this.form = { firstname: '', lastname: '', dni: '', date: '' };
        this.view = 'calendar';
        await this.refreshCalendar();
      } catch (error) {
        console.error(error);
        alert("Error saving appointment");
      }
    },

//////Aca esta el editAppointment//////
    handleEditAppointment(a) {
      this.form = {
        firstname: a.firstname,
        lastname: a.lastname,
        dni: a.dni
      }
      this.editingId = a.appointment_id;
      this.showModal = false;
      this.view = 'create';
    },

//////Aca esta el deleteAppointment//////
    async handleDeleteAppointment(id) {
      try {
        await deleteAppointment(Number(id));

        //Esto me devuelve todos los appointments, pero sacando al que eliminamos
        this.appointments = this.appointments.filter(a => a.id !== id);
        this.showModal = false;
        await this.refreshCalendar();
        this.view = 'calendar';

      } catch (error) {
        console.error(error);
        alert("The appointment couldn't be deleted.");
      }
    },

//////Aca esta el createAppointmentSlot//////
    async handleCreateSlot() {
      try {
        await createAppointmentSlot(this.slotForm);
        this.slotForm = { doctor: '', specialty: '', date: '' };
        this.view = 'calendar';
        await this.refreshCalendar();

      } catch (error) {
        console.error(error);
        alert("The appointment slot couldn't be created.");
      }
    }
  }))
  Alpine.start()
</script>

</body>
</html>
