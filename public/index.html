<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.20/index.global.min.js'></script>
  <link rel="stylesheet" href="./css/styles.css">
  <title>Turnos App</title>

</head>

<body x-data="app" x-init="init()">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="logo"><h2>Medical Appointment Scheduler</h2></div>
    <div class="menu">
      <a href="#">Inicio</a>
      <a href="#">Médicos</a>
      <a href="#">Pacientes</a>
      <a href="#">Login</a>
    </div>
  </div>

  <div class="container">
    
    <!-- SIDEBAR -->
  <div class="sidebar">
      <h2>Panel</h2>
      <button @click="view='calendar'">Calendario</button>
      <button @click="view='create'">Asignar Turno</button>
      <button @click="view='createSlot'">Crear Slot</button>
      <button @click="view='createSlotsInBulk'">Crear Slots en masa</button>
      <button>Configuración</button>
    </div>

    <!-- MAIN -->
    <div class="main">

      <!-- CALENDAR -->
      <div x-show="view === 'calendar'" class="card">
        <h1>Calendario</h1>
        <div id="calendar"></div>    
      </div>
      <!-- MODAL -->
      <div x-show="showModal" class="modal-overlay">        
        <div class="card" id="modalStyle">
          <h2>Detalle del turno</h2>

          <p><strong>Médico:</strong> <span x-text="selectedSlot?.doctor"></span></p>
          <p><strong>Área:</strong> <span x-text="selectedSlot?.specialty"></span></p>

          <p><strong>Fecha y hora:</strong> 
            <span x-text="new Date(selectedSlot?.date).toLocaleString()"></span>
          </p>

          <p><strong>Nombre del paciente:</strong> 
            <span x-text="selectedSlot?.firstname + ' ' + selectedSlot?.lastname || 'Disponible'"></span>
          </p>

          <button>Ver paciente</button>
          <button @click="handleEditAppointment(selectedSlot)">Editar</button>
          <button @click="handleDeleteAppointment(selectedSlot.appointment_id)">Eliminar</button>
          <button @click="showModal = false">Cerrar</button>
        </div>
      </div>

      <!-- FORM PARA TOMAR UN TURNO -->
      <div x-show="view === 'create'" class="card" id="formStyle">
        <h1 x-text="editingId ? 'Editar Turno' : 'Nuevo Turno'"></h1>

        <p><strong>Completa con tus datos:</strong> <span x-text="form.date"></span></p>
        <input type="text" placeholder="Nombre" x-model="form.firstname">
        <input type="text" placeholder="Apellido" x-model="form.lastname">
        <input type="text" placeholder="DNI" x-model="form.dni">

        <button @click="handleScheduleAppointment()">Guardar</button>
      </div>

      <!-- FORM PARA CREAR UN TURNO -->
      <div x-show="view === 'createSlot'" class="card" id="formStyle">
        <h1>Crear Slot</h1>
        <p><strong>Completa los siguientes datos:</strong></p>
        <input type="text" placeholder="Médico" x-model="slotForm.doctor">
        <input type="text" placeholder="Especialidad" x-model="slotForm.specialty">
        <input type="datetime-local" x-model="slotForm.date">

        <button @click="handleCreateSlot()">Guardar</button>
      </div>

      <!-- FORM PARA CREAR TURNOS EN MASA AUTOMATICAMENTE -->
      <div x-show="view === 'createSlotsInBulk'" class="card" id="formStyle">
        <h1>Asignar jornada laboral</h1>
        <p><strong>Completa los siguientes datos:</strong></p>
        <input type="text" placeholder="Médico" x-model="slotForm.doctor">
        <input type="text" placeholder="Especialidad" x-model="slotForm.specialty">
        <div>
          <label><input type="checkbox" value="0" x-model="slotForm.days"> Domingo</label>
          <label><input type="checkbox" value="1" x-model="slotForm.days"> Lunes</label>
          <label><input type="checkbox" value="2" x-model="slotForm.days"> Martes</label>
          <label><input type="checkbox" value="3" x-model="slotForm.days"> Miércoles</label>
          <label><input type="checkbox" value="4" x-model="slotForm.days"> Jueves</label>
          <label><input type="checkbox" value="5" x-model="slotForm.days"> Viernes</label>
          <label><input type="checkbox" value="6" x-model="slotForm.days"> Sábado</label>
        </div>
        <input type="time" placeholder="Inicio de jornada" x-model="slotForm.start_time">
        <input type="time" placeholder="Fin de jornada" x-model="slotForm.end_time">

        <button @click="handleCreateSlotsInBulk()">Guardar</button>
      </div>

      
      <!-- VISTA DE TABLA AL CLICKEAR UN DIA -->
      <div x-show="view === 'dayView'" class="card">
        <h1 x-text="'Turnos del día: ' + selectedDate"></h1>

        <div class="schedule-table"> 
          <template x-for="hour in hours" :key="hour">
            <div class="row">
              <!-- Columna hora -->
              <div class="hour" x-text="hour"></div>
              <!-- Columna turnos -->
              <div class="slots">

                <template x-if="daySlotsByHour[hour]">
                  <template x-for="slot in daySlotsByHour[hour]" :key="slot.id">
                    
                    <div 
                      class="calendar-box"
                      :class="slot.is_booked ? 'occupied' : 'available'"
                      @click="handleSlotClick(slot)"
                    >
                      <div x-text="'Médico: ' + slot.doctor"></div>
                      <div x-text="'Área: ' + slot.specialty"></div>
                      <div x-text="slot.is_booked ? 'Paciente: ' + slot.firstname + ' ' + slot.lastname : 'Disponible'"></div>
                    </div>
                  </template>
                </template>
              </div>
            </div>
          </template>
        </div>
      </div>

<script type="module">
  import Alpine from 'https://unpkg.com/alpinejs@3.x.x/dist/module.esm.js'
  import { scheduleAppointment, editAppointment, deleteAppointment } from './js/appointments.js'
  import { createAppointmentSlot, createSlotsInBulk } from './js/slots.js'

  window.Alpine = Alpine
  Alpine.data('app', () => ({
    view: 'calendar',
    appointments: [],
    editingId: null,
    selectedDate: null,
    daySlots: [], //turnos que hay en cada dia
    daySlotsByHour: {}, //turnos que hay en un dia, agrupados por hora
    hours: [],  //Las horas que vamos a tener, por ahora 00, 01, 02...24

    form: {
      firstname: '',
      lastname: '',
      dni: '',
    },

    slotForm: {
      doctor: '',
      specialty: '',
      start_time: '',
      end_time: '',
      days: [] 
    },

    days: [],
    selectedSlot: null,
    showModal: false,

    async init() {
      this.generateWeek();
      await this.initCalendar();
      this.showModal = false;
    },

    generateWeek() {
      const today = new Date();
      this.days = [];

      for (let i = 0; i < 7; i++) {
        let d = new Date();
        d.setDate(today.getDate() + i);
        this.days.push(d.toISOString().split('T')[0]);
      }
    },

    formatTime(date) {
      return new Date(date).toLocaleTimeString([], {
        hour: '2-digit',
        minute: '2-digit'
      });
    },

    async loadDaySlots() {
      const res = await fetch("http://localhost:3000/slots");
      const slots = await res.json();

      this.daySlots = slots.filter(s =>
        s.date.startsWith(this.selectedDate)
      );
    },
    formatTime(date) {
      return new Date(date).toLocaleTimeString([], {
        hour: '2-digit',
        minute: '2-digit'
      });
    },
    generateHours() {
      this.hours = [];
      for (let h = 6; h <= 22; h++) {
        this.hours.push(`${h.toString().padStart(2, '0')}:00`);
      }
    },
    groupSlotsByHour() {
      this.daySlotsByHour = {};

      for (const slot of this.daySlots) {
        const hour = this.formatTime(slot.date);

        if (!this.daySlotsByHour[hour]) {
          this.daySlotsByHour[hour] = [];
        }

        this.daySlotsByHour[hour].push(slot);
      }
    },

    async refreshCalendar() {
      const res = await fetch("http://localhost:3000/slots");
      const slots = await res.json();

      this.calendar.removeAllEvents();

      this.calendar.addEventSource(
        slots.map(s => ({
          id: s.id,
          title: s.is_booked && s.firstname ? (s.firstname + ' ' + s.lastname): "Disponible",
          start: s.date,
          color: s.is_booked ? "red" : "green",
          extendedProps: {
            is_booked: s.is_booked,
            appointment_id: s.appointment_id,
            doctor: s.doctor,
            specialty: s.specialty,
            firstname: s.firstname,
            lastname: s.lastname,
            dni: s.dni
          }
        }))
      );
    },

    async initCalendar() {
      const res = await fetch("http://localhost:3000/slots")
      const slots = await res.json()

      this.calendar = new FullCalendar.Calendar(
        document.getElementById('calendar'),
        {
          initialView: 'dayGridMonth',
          height: "auto",
          contentHeight: 700,

          events: slots.map(s => ({
            id: s.id,
            title: s.is_booked && s.firstname ? (s.firstname + ' ' + s.lastname): "Disponible",
            start: s.date,
            color: s.is_booked ? "red" : "green",
            extendedProps: {
              is_booked: s.is_booked,
              appointment_id: s.appointment_id,
              doctor: s.doctor,
              specialty: s.specialty,
              firstname: s.firstname,
              lastname: s.lastname,
              dni: s.dni
            }
          })),

          //Lo que ocurre al clickear la casilla de un día
          dateClick: async (info) => {
            this.selectedDate = info.dateStr;
            await this.loadDaySlots();
            this.generateHours();
            this.groupSlotsByHour();
            this.view = 'dayView';
          },

          //La lógica de clickear en un turno (disponible o agendado)
          eventClick: async (info) => {
            const props = info.event.extendedProps;

            if (!props.is_booked) {  //Te lleva al forms a agendar un turno
              this.form = {
                slot_id: info.event.id,
                firstname: "",
                lastname: "",
                dni: ""
              };
              this.view = 'create';

            } else {  //Te lleva al Modal a editar tu turno
              this.editingId = props.appointment_id;
              //this.view = "edit";
              this.selectedSlot = {
                id: info.event.id,
                appointment_id: props.appointment_id,
                doctor: props.doctor,
                specialty: props.specialty,
                firstname: props.firstname,
                lastname: props.lastname,
                dni: props.dni,
                date: info.event.start,
              };
              this.showModal = true
            }
          }
        }
      )

      this.calendar.render()
    },

//////Aca esta el scheduleAppointment//////
    async handleScheduleAppointment() {
      try {
        if (this.editingId) {
          await editAppointment(this.editingId, this.form);
          this.editingId = null;
        } else {
          await scheduleAppointment(this.form);
        }
        this.form = { firstname: '', lastname: '', dni: '', date: '' };
        this.view = 'calendar';
        await this.refreshCalendar();
      } catch (error) {
        console.error(error);
        alert("Error saving appointment");
      }
    },

//////Aca esta el editAppointment//////
    handleEditAppointment(a) {
      this.form = {
        firstname: a.firstname,
        lastname: a.lastname,
        dni: a.dni
      }
      this.editingId = a.appointment_id;
      this.showModal = false;
      this.view = 'create';
    },

//////Aca esta el deleteAppointment//////
    async handleDeleteAppointment(id) {
      console.log("ID a eliminar:", id);
      try {
        await deleteAppointment(Number(id));

        //Esto me devuelve todos los appointments, pero sacando al que eliminamos
        this.appointments = this.appointments.filter(a => a.id !== id);
        this.showModal = false;
        await this.refreshCalendar();
        this.view = 'calendar';

      } catch (error) {
        console.error(error);
        alert("The appointment couldn't be deleted.");
      }
    },

//////Aca esta el createAppointmentSlot//////
    async handleCreateSlot() {
      try {
        await createAppointmentSlot(this.slotForm);
        this.slotForm = { doctor: '', specialty: '',  days: this.slotForm.days.map(Number), start_time: '', end_time: ''};
        this.view = 'calendar';
        await this.refreshCalendar();

      } catch (error) {
        console.error(error);
        alert("The appointment slot couldn't be created.");
      }
    },

//////Aca esta el createSlotsInBulk//////
    async handleCreateSlotsInBulk() {
      try {
        await createSlotsInBulk(this.slotForm);
        this.slotForm = { doctor: '', specialty: '', days: this.slotForm.days.map(Number), start_time: '', end_time: '' };
        this.view = 'calendar';
        await this.refreshCalendar();

      } catch (error) {
        console.error(error);
        alert("The appointment slots couldn't be bulk-created.");
      }
    },

//////Aca esta el slotClick//////
    async handleSlotClick(slot) {
      if (!slot.is_booked) {
        this.form = {
          slot_id: slot.id,
          firstname: "",
          lastname: "",
          dni: ""
        };
        this.view = 'create';
      } else {
        this.editingId = slot.appointment_id;
        this.selectedSlot = {
          id: slot.id,
          appointment_id: slot.appointment_id,
          doctor: slot.doctor,
          specialty: slot.specialty,
          firstname: slot.firstname,
          lastname: slot.lastname,
          dni: slot.dni,
          date: slot.date
        }
        this.showModal = true;
      }
    }

  }))
  Alpine.start()
</script>

</body>
</html>
