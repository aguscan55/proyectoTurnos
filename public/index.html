<!DOCTYPE html>
<html>
<head>
  <title>Turnos App</title>

  <!-- Alpine -->
  <script src="https://unpkg.com/alpinejs" defer></script>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="p-5">

  <div x-data="{ mensaje: '' }">
    <h1 class="text-2xl mb-4">Sistema de Turnos</h1>

    <button 
      class="bg-blue-500 text-white px-4 py-2"
      @click="fetch('http://localhost:3000')
        .then(res => res.text())
        .then(data => mensaje = data)">
      Probar backend
    </button>

    <p x-text="mensaje" class="mt-4"></p>
  </div>

</body>
</html>
