<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Turnos App</title>
  <script src="https://unpkg.com/alpinejs" defer></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      display: flex;
    }

    .sidebar {
      width: 220px;
      background: #1e1e2f;
      color: white;
      height: 100vh;
      padding: 20px;
    }

    .sidebar button {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      background: #333;
      border: none;
      color: white;
      cursor: pointer;
    }

    .main {
      flex: 1;
      padding: 20px;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
    }

    .day {
      border: 1px solid #ccc;
      min-height: 120px;
      padding: 5px;
    }

    .appointment {
      background: #4caf50;
      color: white;
      margin-top: 5px;
      padding: 4px;
      font-size: 12px;
    }

    input, button {
      padding: 8px;
      margin: 5px 0;
    }
  </style>
</head>

<body x-data="app()" x-init="init()">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2>Turnos</h2>
    <button @click="view='calendar'">Calendario</button>
    <button @click="view='create'">Nuevo turno</button>
  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- CALENDAR -->
    <div x-show="view === 'calendar'">
      <h1>Calendario</h1>

      <div class="calendar">
        <template x-for="day in days" :key="day">
          <div class="day">
            <strong x-text="day"></strong>

            <template x-for="a in appointments.filter(x => x.date.slice(0, 10) === day)">
              <div class="appointment">
                <div x-text="a.client_name"></div>
                <div x-text="formatTime(a.date)"></div>

                <button @click="editAppointment(a)">Editar</button>
                <button @click="handleDeleteAppointment(a)">Eliminar turno</button>
              </div>
            </template>

          </div>
        </template>
      </div>
    </div>

    <!-- FORM -->
    <div x-show="view === 'create'">
      <h1 x-text="editingId ? 'Editar Turno' : 'Nuevo Turno'"></h1>

      <input type="text" placeholder="Nombre" x-model="form.name">
      <input type="datetime-local" x-model="form.date">

      <button @click="handleCreateAppointment()">Guardar</button>
    </div>

  </div>

<script>
function app() {
  return {
    view: 'calendar',
    appointments: [],
    editingId: null,

    form: {
      name: '',
      date: ''
    },

    days: [],

    async init() {
      this.generateWeek();
      await this.loadAppointments();
    },

    generateWeek() {
      const today = new Date();
      this.days = [];

      for (let i = 0; i < 7; i++) {
        let d = new Date();
        d.setDate(today.getDate() + i);
        this.days.push(d.toISOString().split('T')[0]);
      }
    },

    async loadAppointments() {
      const res = await fetch("http://localhost:3000/appointments");
      this.appointments = await res.json();
    },

    editAppointment(a) {
      this.form.name = a.client_name;
      this.form.date = a.date.slice(0, 16);
      this.editingId = a.id;
      this.view = 'create';
    },

    async handleCreateAppointment() {
      if (this.editingId) {
        await fetch(`http://localhost:3000/appointments/${this.editingId}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            client_name: this.form.name,
            date: this.form.date
          })
        });

        this.editingId = null;

      } else {
        await fetch("http://localhost:3000/appointments", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            client_name: this.form.name,
            date: this.form.date
          })
        });
      }

      this.form.name = '';
      this.form.date = '';

      this.view = 'calendar';
      await this.loadAppointments();
    },

    formatTime(date) {
      return new Date(date).toLocaleTimeString([], {
        hour: '2-digit',
        minute: '2-digit'
      });
    },
      //Aca esta el deleteAppointment
    async handleDeleteAppointment(id) {
      try {
        const res = await fetch(`http://localhost:3000/appointments/${id}`, {
          method: "DELETE"
        });
        console.log("Deleted:", response);
        //Esto me devuelve todos los appointments, pero sacando al que eliminamos
        this.appointments = this.appointments.filter(a => a.id !== id);
        return res.json();
      } catch (error) {
        console.error(error);
        alert("The appointment couldn't be deleted.");
      }
      this.view = 'calendar';
    }
  }
}
</script>

</body>
</html>
