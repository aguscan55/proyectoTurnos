<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.20/index.global.min.js'></script>
  <title>Turnos App</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      display: flex;
    }

    .sidebar {
      width: 220px;
      background: #1e1e2f;
      color: white;
      height: 100vh;
      padding: 20px;
    }

    .sidebar button {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      background: #333;
      border: none;
      color: white;
      cursor: pointer;
    }

    .main {
      flex: 1;
      padding: 20px;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
    }

    .day {
      border: 1px solid #ccc;
      min-height: 120px;
      padding: 5px;
    }

    .appointment {
      background: #4caf50;
      color: white;
      margin-top: 5px;
      padding: 4px;
      font-size: 12px;
    }

    input, button {
      padding: 8px;
      margin: 5px 0;
    }
  </style>
</head>

<body x-data="app" x-init="init()">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2>Turnos</h2>
    <button @click="view='calendar'">Calendario</button>
    <button @click="view='create'">Nuevo turno</button>
  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- CALENDAR ELIMINAR
    <div x-show="view === 'calendar'">
      <h1>Calendario</h1>

      <div class="calendar">
        <template x-for="day in days" :key="day">
          <div class="day">
            <strong x-text="day"></strong>

            <template x-for="a in appointments.filter(x => x.date.slice(0, 10) === day)">
              <div class="appointment">
                <div x-text="a.client_name"></div>
                <div x-text="formatTime(a.date)"></div>

                <button @click="handleEditAppointment(a)">Editar</button>
                <button @click="handleDeleteAppointment(a.id)">Eliminar turno</button>
              </div>
            </template>

          </div>
        </template>
      </div>
    </div> -->
    <!-- CALENDAR -->
    <div x-show="view === 'calendar'">
      <h1>Calendario</h1>
      <div id="calendar"></div>    
    </div>
    <!-- La ventanita que aparece al clickear sobre un turno ya existente: -->
    <div x-show="showModal" style="
      position: fixed;
      top:0; left:0;
      width:100%; height:100%;
      background: rgba(0,0,0,0.5);
      display:flex;
      align-items:center;
      justify-content:center;
    ">
      <div style="background:rgb(223, 251, 255); padding:20px; border-radius:10px;">

        <h2>Turno</h2>

        <p><strong>Nombre:</strong> <span x-text="selectedAppointment?.client_name"></span></p>
        <p><strong>Fecha:</strong> <span x-text="selectedAppointment?.date"></span></p>

        <button @click="handleEditAppointment(selectedAppointment)">Editar</button>
        <button @click="handleDeleteAppointment(selectedAppointment.id)">Eliminar</button>
        <button @click="showModal = false">Cerrar</button>

      </div>
    </div>

    <!-- FORM -->
    <div x-show="view === 'create'">
      <h1 x-text="editingId ? 'Editar Turno' : 'Nuevo Turno'"></h1>

      <input type="text" placeholder="Nombre" x-model="form.name">
      <input type="datetime-local" x-model="form.date">

      <button @click="handleCreateAppointment()">Guardar</button>
    </div>

  </div>

<script type="module">
  import Alpine from 'https://unpkg.com/alpinejs@3.x.x/dist/module.esm.js'
  import { createAppointment, editAppointment, deleteAppointment } from './js/appointments.js'

  window.Alpine = Alpine
  Alpine.data('app', () => ({
    view: 'calendar',
    appointments: [],
    editingId: null,

    form: {
      name: '',
      date: ''
    },

    days: [],
    selectedAppointment: null,
    showModal: false,

    async init() {
      this.generateWeek();
      await this.initCalendar();
      //await this.loadAppointments();
    },

    generateWeek() {
      const today = new Date();
      this.days = [];

      for (let i = 0; i < 7; i++) {
        let d = new Date();
        d.setDate(today.getDate() + i);
        this.days.push(d.toISOString().split('T')[0]);
      }
    },

    formatTime(date) {
      return new Date(date).toLocaleTimeString([], {
        hour: '2-digit',
        minute: '2-digit'
      });
    },

//    async loadAppointments() {
//      const res = await fetch("http://localhost:3000/appointments");
//      this.appointments = await res.json();
//    }, la de abajo seria su reemplazo usando FullCalendar

    async refreshCalendar() {
      const res = await fetch("http://localhost:3000/appointments");
      const appointments = await res.json();

      this.calendar.removeAllEvents();

      this.calendar.addEventSource(
        appointments.map(a => ({
          id: a.id,
          title: a.client_name,
          start: a.date
        }))
      );
    },

    async initCalendar() {
      const res = await fetch("http://localhost:3000/appointments")
      const appointments = await res.json()

      this.calendar = new FullCalendar.Calendar(
        document.getElementById('calendar'),
        {
          initialView: 'dayGridMonth',

          events: appointments.map(a => ({
            id: a.id,
            title: a.client_name,
            start: a.date
          })),

          dateClick: (info) => {
            this.form.date = info.dateStr + "T09:00";
            this.view = 'create';
          },

          eventClick: async (info) => {
            this.selectedAppointment = {
              id: info.event.id,
              client_name: info.event.title,
              date: info.event.start.toISOString()
            },
            this.showModal = true
          }
        }
      )

      this.calendar.render()
    },

//////Aca esta el editAppointment//////
    handleEditAppointment(a) {
      this.form.name = a.client_name;
      //Cambie esto porque rompia el .slice cuando el input no era String
      const dateStr = typeof a.date === "string"
        ? a.date
        : a.date.toISOString();
      this.form.date = dateStr.slice(0, 16);
      this.editingId = a.id;
      this.showModal = false;
      this.view = 'create';
    },

//////Aca esta el createAppointment//////
    async handleCreateAppointment() {
      try {
        if (this.editingId) {
          await editAppointment(this.editingId, this.form);
          this.editingId = null;
        } else {
          await createAppointment(this.form);
        }
        this.form.name = '';
        this.form.date = '';

        this.view = 'calendar';
        await this.refreshCalendar();
      } catch (error) {
        console.error(error);
        alert("Error saving appointment");
      }
    },

//////Aca esta el deleteAppointment//////
    async handleDeleteAppointment(id) {
      try {
        await deleteAppointment(Number(id));

        //Esto me devuelve todos los appointments, pero sacando al que eliminamos
        this.appointments = this.appointments.filter(a => a.id !== id);
        this.showModal = false;
        await this.refreshCalendar();
        this.view = 'calendar';

      } catch (error) {
        console.error(error);
        alert("The appointment couldn't be deleted.");
      }
    }
  }))
  Alpine.start()
</script>

</body>
</html>
